name: eBay Deals Worker Tests
on:
  push:
    paths:
      - "ebay-worker/**"
      - "deal-finder/live.js"
      - ".github/workflows/ebay-worker-tests.yml"
  pull_request:
    paths:
      - "ebay-worker/**"
      - "deal-finder/live.js"
      - ".github/workflows/ebay-worker-tests.yml"
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check ebay-worker/index.js
      - run: node --check deal-finder/live.js
      - run: node --test ebay-worker/worker.test.mjs
